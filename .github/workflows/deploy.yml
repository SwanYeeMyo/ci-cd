name: Deploy to VPS

on:
  push:
    tags:
      - "tag.*"
      - "production-*"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_REF_NAME
          script: |
            cd /code/ci-cd

            git fetch --tags
            git checkout $GITHUB_REF_NAME

            # 1. Rebuild and start the containers
            docker compose up -d --build

            # 2. Run Database Migrations
            # The '-T' flag is necessary for CI/CD pipelines so it doesn't wait for human input
            docker compose exec -T app php artisan migrate --force

            # Optional: Clear and cache Laravel config/routes for better performance
            docker compose exec -T app php artisan optimize:clear
            docker compose exec -T app php artisan optimize
